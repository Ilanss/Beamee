<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beamee</title>
    <link rel="stylesheet" href="css/output.css">
    <link rel="icon" type="image/x-icon" href="/img/beamee-icon.ico">
</head>

<body id="main" class="h-screen overflow-hidden">

    <!-- Settings view: full-page overlay, hidden by default -->
    <div id="settings-view" hidden style="position:fixed;inset:0;z-index:50;">
        <iframe id="settings-iframe" src="settings.html" style="width:100%;height:100%;border:none;"></iframe>
    </div>

    <div class="wrapper h-full">

        <!-- ===== SIDEBAR ===== -->
        <div class="sidebar menu menu-xs w-full flex flex-col min-h-0 bg-base-200">
            <img src="/img/beamee-logo.png" alt="" class="object-contain h-10 object-left">

            <div class="library flex flex-col flex-1 min-h-0">
                <!-- Search -->
                <label id="library-search-wrap"
                    class="flex items-center my-2 input input-sm input-border flex w-auto items-center gap-2">
                    <input id="library-search" type="text" placeholder="Search"
                        class="w-full h-full outline-none text-sm">
                    <div id="search-icon" class="h-full flex items-center cursor-pointer">
                        <!-- search SVG, swapped to X when active -->
                        <svg id="search-svg" xmlns="http://www.w3.org/2000/svg" width="22" height="22"
                            viewBox="0 0 30 30" fill="currentColor">
                            <path
                                d="M13 3C7.489 3 3 7.489 3 13s4.489 10 10 10a9.95 9.95 0 0 0 6.322-2.264l5.971 5.971a1 1 0 1 0 1.414-1.414l-5.97-5.97A9.95 9.95 0 0 0 23 13c0-5.511-4.489-10-10-10m0 2c4.43 0 8 3.57 8 8s-3.57 8-8 8-8-3.57-8-8 3.57-8 8-8" />
                        </svg>
                    </div>
                </label>

                <!-- Library heading -->
                <div class="flex justify-between items-center gap-2 pb-2">
                    <h2 class="prose">Library</h2>
                </div>

                <!-- Library tree -->
                <div id="library-list" class="overflow-y-scroll min-h-0 flex-1 border-b border-base-300">
                    <ul id="library-ul"></ul>
                </div>
            </div>
        </div>

        <!-- ===== VERSE DISPLAY ===== -->
        <div id="verse-display" class="prose px-4">
            <div class="flex justify-between items-center gap-2 h-15">
                <h2 id="song-name" class="mt-0 mb-0"></h2>
                <h3 id="song-number" class="mb-0 font-thin text-sm"></h3>
            </div>
            <ul id="verse-list" class="list-none p-0 mt-0">
                <li id="song-placeholder" class="text-center pt-16 text-lg font-bold">
                    <p>
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                            stroke="currentColor" class="size-6 inline-block mr-3">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
                        </svg>
                        Select a song
                    </p>
                </li>
            </ul>
        </div>

        <!-- ===== PREVIEW BOX ===== -->
        <div id="preview-box" class="preview-box bg-base-200 flex flex-col">
            <div id="preview" class="m-2 mb-6 overflow-hidden relative rounded-field">
                <div id="preview-lyrics" style="width:100%;height:100%;box-sizing:border-box;"></div>
            </div>
            <div class="mt-2 m-2 flex-1">
                <fieldset>
                    <label class="label">
                        <input id="arrangement" type="checkbox" checked class="checkbox" />
                        <span>Use arrangement</span>
                    </label>
                </fieldset>
            </div>
            <div id="copyright" class="opacity-60 text-xs text-center">
                <p></p>
            </div>
        </div>

        <!-- ===== PLAYBACK CONTROLS ===== -->
        <div id="projection-control-wrapper"
            class="controls flex items-center w-full py-2 px-2 border-t border-base-300">
            <div class="flex-1 flex justify-center items-center gap-2">
                <!-- Prev -->
                <button id="prev-verse" class="btn btn-sm btn-circle">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="size-4">
                        <path
                            d="M8.5 4.75a.75.75 0 0 0-1.107-.66l-6 3.25a.75.75 0 0 0 0 1.32l6 3.25a.75.75 0 0 0 1.107-.66V8.988l5.393 2.921A.75.75 0 0 0 15 11.25v-6.5a.75.75 0 0 0-1.107-.66L8.5 7.013V4.75Z" />
                    </svg>
                </button>

                <!-- Toggle projection -->
                <button id="toggle-projection" class="btn btn-circle">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="size-4">
                        <path
                            d="M3 3.732a1.5 1.5 0 0 1 2.305-1.265l6.706 4.267a1.5 1.5 0 0 1 0 2.531l-6.706 4.268A1.5 1.5 0 0 1 3 12.267V3.732Z" />
                    </svg>
                </button>

                <!-- Next -->
                <button id="next-verse" class="btn btn-sm btn-circle">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="size-4">
                        <path
                            d="M2.53 3.956A1 1 0 0 0 1 4.804v6.392a1 1 0 0 0 1.53.848l5.113-3.196c.16-.1.279-.233.357-.383v2.73a1 1 0 0 0 1.53.849l5.113-3.196a1 1 0 0 0 0-1.696L9.53 3.956A1 1 0 0 0 8 4.804v2.731a.992.992 0 0 0-.357-.383L2.53 3.956Z" />
                    </svg>
                </button>

                <!-- Black screen -->
                <button id="black-screen" class="btn btn-sm btn-circle">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="size-4">
                        <path fill-rule="evenodd"
                            d="M3.28 2.22a.75.75 0 0 0-1.06 1.06l10.5 10.5a.75.75 0 1 0 1.06-1.06l-1.322-1.323a7.012 7.012 0 0 0 2.16-3.11.87.87 0 0 0 0-.567A7.003 7.003 0 0 0 4.82 3.76l-1.54-1.54Zm3.196 3.195 1.135 1.136A1.502 1.502 0 0 1 9.45 8.389l1.136 1.135a3 3 0 0 0-4.109-4.109Z"
                            clip-rule="evenodd" />
                        <path
                            d="m7.812 10.994 1.816 1.816A7.003 7.003 0 0 1 1.38 8.28a.87.87 0 0 1 0-.566 6.985 6.985 0 0 1 1.113-2.039l2.513 2.513a3 3 0 0 0 2.806 2.806Z" />
                    </svg>
                </button>
            </div>
            <!-- Settings button — right-aligned, matches Electron layout -->
            <div class="text-right" style="width:80px;">
                <button id="settings-btn" class="btn btn-sm btn-circle">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-4">
                        <path fill-rule="evenodd"
                            d="M11.078 2.25c-.917 0-1.699.663-1.85 1.567L9.05 4.889c-.02.12-.115.26-.297.348a7.493 7.493 0 0 0-.986.57c-.166.115-.334.126-.45.083L6.3 5.508a1.875 1.875 0 0 0-2.282.819l-.922 1.597a1.875 1.875 0 0 0 .432 2.385l.84.692c.095.078.17.229.154.43a7.598 7.598 0 0 0 0 1.139c.015.2-.059.352-.153.43l-.841.692a1.875 1.875 0 0 0-.432 2.385l.922 1.597a1.875 1.875 0 0 0 2.282.818l1.019-.382c.115-.043.283-.031.45.082.312.214.641.405.985.57.182.088.277.228.297.35l.178 1.071c.151.904.933 1.567 1.85 1.567h1.844c.916 0 1.699-.663 1.85-1.567l.178-1.072c.02-.12.114-.26.297-.349.344-.165.673-.356.985-.57.167-.114.335-.125.45-.082l1.02.382a1.875 1.875 0 0 0 2.28-.819l.923-1.597a1.875 1.875 0 0 0-.432-2.385l-.84-.692c-.095-.078-.17-.229-.154-.43a7.614 7.614 0 0 0 0-1.139c-.016-.2.059-.352.153-.43l.84-.692c.708-.582.891-1.59.433-2.385l-.922-1.597a1.875 1.875 0 0 0-2.282-.818l-1.02.382c-.114.043-.282.031-.449-.083a7.49 7.49 0 0 0-.985-.57c-.183-.087-.277-.227-.297-.348l-.179-1.072a1.875 1.875 0 0 0-1.85-1.567h-1.843ZM12 15.75a3.75 3.75 0 1 0 0-7.5 3.75 3.75 0 0 0 0 7.5Z"
                            clip-rule="evenodd" />
                    </svg>
                </button>
            </div>
        </div>

    </div>
    <script type="module" src="js/control.js"></script>
</body>

</html>
