<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beamee Projection</title>
    <link rel="stylesheet" href="css/output.css">
    <style>
        /* Override any theme classes — projection is always full black */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }
        #projection {
            background-color: #000000;
            color: #ffffff;
            font-family: sans-serif;
            font-weight: bold;
            padding: 2rem;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            box-sizing: border-box;
        }
        #lyrics {
            width: 100%;
            height: 100%;
            box-sizing: border-box;
        }
        #lyrics p {
            margin: 0;
        }
    </style>
</head>
<body>
    <div id="projection">
        <div id="lyrics"></div>
    </div>
    <script src="js/projector.js"></script>
</body>
</html>
